name: Feature request / Enhancement
description: Suggest an idea or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement or new feature.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief one-line or short description of the feature or change.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance Criteria
      description: Testable checklist of requirements for considering this done.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, examples, alternatives considered, or related issues.
    validations:
      required: false
