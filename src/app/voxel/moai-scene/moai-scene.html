          <svg viewBox="0 0 3 3"><path d="M0 0h3v1H0zM1 1h1v1H1zM0 2h3v1H0z" /></svg>
        }
      </span>

    }

      <p class="moai-line" aria-hidden="true">{{ said.text }}</p>
