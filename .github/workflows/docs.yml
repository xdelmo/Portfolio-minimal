# The handbook (issue #454): every pull request that touches it builds it strictly and checks it for sensitive data;
# master publishes it on GitHub Pages.
name: Docs

on:
  push:
    branches: [master]
    paths: ['handbook/**', 'mkdocs.yml', 'scripts/handbook-check.mjs', '.github/workflows/docs.yml']
  pull_request:
    branches: [master, devel]
    paths: ['handbook/**', 'mkdocs.yml', 'scripts/handbook-check.mjs', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/handbook-check.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: handbook/requirements.txt
      - run: pip install -r handbook/requirements.txt
      - run: mkdocs build --strict
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
